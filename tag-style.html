<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>食品合规卫士 V22.0 (智能别名版)</title>
    <style>
        /* --- UI 保持 V21.0 现代风格 --- */
        :root {
            --primary: #4361EE; --primary-dark: #3F37C9;
            --bg-color: #F8F9FE; --card-shadow: 0 10px 30px -10px rgba(67, 97, 238, 0.15);
            --text-main: #2B2D42; --text-sub: #8D99AE;
            --c-green: #06D6A0; --bg-green: #E6FFFA;
            --c-blue: #4CC9F0; --bg-blue: #E0F7FA;
            --c-yellow: #F59E0B; --bg-yellow: #FFFBEB;
            --c-red: #EF476F; --bg-red: #FFF0F3;
            --c-black: #2B2D42; --bg-black: #E9ECEF;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg-color); color: var(--text-main); line-height: 1.6; }
        .header { background: linear-gradient(135deg, #4361EE, #7209B7); color: white; padding: 40px 20px 80px; text-align: center; border-radius: 0 0 30px 30px; position: relative; }
        .header h1 { margin: 0; font-size: 26px; font-weight: 800; }
        .header p { font-size: 13px; opacity: 0.9; margin-top: 8px; }
        .container { max-width: 600px; margin: -50px auto 30px; padding: 0 20px; position: relative; z-index: 10; }
        .card { background: #FFF; border-radius: 24px; padding: 25px; box-shadow: var(--card-shadow); margin-bottom: 20px; }
        .search-box { display: flex; gap: 12px; }
        .input-wrap { flex: 1; background: #F8F9FA; border-radius: 16px; padding: 0 16px; display: flex; align-items: center; height: 56px; border: 2px solid transparent; transition: all 0.3s; }
        .input-wrap:focus-within { background: #FFF; border-color: var(--primary); box-shadow: 0 4px 12px rgba(67, 97, 238, 0.2); }
        .search-input { border: none; background: transparent; width: 100%; height: 100%; font-size: 17px; outline: none; }
        .btn-search { background: var(--primary); color: white; border: none; width: 56px; height: 56px; border-radius: 16px; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .tags { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; justify-content: center; }
        .tag { padding: 8px 16px; border-radius: 100px; background: #FFF; border: 1px solid #E9ECEF; color: var(--text-sub); font-size: 13px; cursor: pointer; }
        #resultView { display: none; animation: slideUp 0.4s ease-out; }
        .res-header { text-align: center; padding-bottom: 20px; border-bottom: 1px dashed #E9ECEF; margin-bottom: 20px; }
        .res-icon { font-size: 56px; display: block; margin-bottom: 10px; }
        .res-title { font-size: 24px; font-weight: 800; margin: 0; }
        .risk-alert { padding: 16px; border-radius: 16px; font-size: 14px; margin-top: 15px; position: relative; overflow: hidden; }
        .alias-tip { background: #E3F2FD; color: #1565C0; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; display: flex; align-items: center; gap: 6px; }
        
        /* 状态颜色 */
        .green .res-title { color: var(--c-green); } .green .risk-alert { background: var(--bg-green); color: #00695C; }
        .red .res-title { color: var(--c-red); } .red .risk-alert { background: var(--bg-red); color: #C92A2A; }
        .yellow .res-title { color: var(--c-yellow); } .yellow .risk-alert { background: var(--bg-yellow); color: #B45309; }
        .blue .res-title { color: var(--c-blue); } .blue .risk-alert { background: var(--bg-blue); color: #0277BD; }
        .black .res-title { color: var(--c-black); } .black .risk-alert { background: var(--bg-black); color: #212529; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="header">
    <h1>食品原料合规卫士 </h1>
<p>安全部：李川，如有疑问企业微信联系我</p>

    <p>智能识别：别名解析 · 药食同源 · 负面清单 · 药典</p>
</div>

<div class="container">
    <div class="card">
        <div class="search-box">
            <div class="input-wrap">
                <input type="text" id="searchInput" class="search-input" placeholder="试搜别名: 大料、淮山、元肉、冬虫夏草..." onkeypress="if(event.key==='Enter') doSearch()">
            </div>
            <button class="btn-search" onclick="doSearch()">🔍</button>
        </div>
        <div class="tags">
            <span class="tag" onclick="fill('大料')">大料(即八角)</span>
            <span class="tag" onclick="fill('淮山')">淮山(即山药)</span>
            <span class="tag" onclick="fill('元肉')">元肉(即龙眼)</span>
            <span class="tag" onclick="fill('冬虫夏草')">冬虫夏草(禁)</span>
            <span class="tag" onclick="fill('五指毛桃')">五指毛桃(普)</span>
        </div>
    </div>

    <div id="resultView" class="card"></div>
</div>

<script>
    // --- 1. 别名与同源数据处理 (核心新增) ---

蒲公英=黄花地丁=婆婆丁=蒲公草=黄花苗=地丁
蜂蜜=蜜糖=蜂糖=白蜜=百花蜜

酸枣仁=枣仁=酸枣核=山枣仁=睡仁
鲜白茅根=茅根=白茅根=茅草根=甜草根=丝茅根
鲜芦根=芦根=苇根=芦茅根=苇茎=芦竹根

薄荷=苏薄荷=薄荷叶=薄荷梗=蕃荷菜=南薄荷

藿香=广藿香=土藿香=合香=苍告=山茴香

铁皮石斛=铁皮枫斗=枫斗=铁皮兰=黑节草
西洋参=花旗参=洋参=西洋人参
黄芪=黄耆=北芪=绵黄芪=箭芪=独根

山茱萸=萸肉=山萸肉=枣皮=蜀枣=药枣
天麻=明天麻=赤箭=定风草=神草=水洋芋
杜仲叶=杜仲茶=丝棉木叶=思仲叶
地黄=生地=生地黄=熟地=熟地黄=怀地黄=干地黄
麦冬=麦门冬=寸冬=杭麦冬=浙麦冬
天冬=天门冬=明天冬=天冬草=倪铃=丝冬
化橘红=化州橘红=橘红=化红=柚皮橘红=毛橘红`;

    // 2. 初始化别名映射表
    const ALIAS_MAP = {};
    const HOMOLOGY_SET = new Set();

    // 自动解析别名数据
    HOMOLOGY_ALIAS_RAW.trim().split('\n').forEach(line => {
        if (!line.trim()) return;
        const parts = line.split('=');
        const standardName = parts[0].trim();
        
        if (standardName) {
            HOMOLOGY_SET.add(standardName); // 加入同源白名单
            // 将所有名称（包括标准名和别名）都映射到标准名
            parts.forEach(name => {
                ALIAS_MAP[name.trim()] = standardName;
            });
        }
    });

    // --- 3. 搜索交互逻辑 ---
    function fill(val) {
        document.getElementById('searchInput').value = val;
        doSearch();
    }

    function doSearch() {
        let input = document.getElementById('searchInput').value.trim();
        if(!input) return;

        let html = '';
        const view = document.getElementById('resultView');
        let aliasTip = '';
        
        // 🚀 智能映射：如果输入的是别名，自动转换为标准名
        // 优先检查别名表，如果匹配到，将 searchKey 替换为标准名
        let searchKey = input;
        if (ALIAS_MAP[input]) {
            searchKey = ALIAS_MAP[input];
            // 如果输入和标准名不一样，显示提示
            if (input !== searchKey) {
                aliasTip = `<div class="alias-tip"><span>💡</span> 智能识别：您搜的 <strong>${input}</strong> 是 <strong>${searchKey}</strong> 的别名</div>`;
            }
        }

        try {
            // --- 判定逻辑 (使用 searchKey 进行核心库查询) ---
            
            // 1. 💀 剧毒/禁用 (原样保持，优先级最高)
            if (DATA.HEALTH_BANNED.has(input) || input.includes('罂粟') || DATA.HEALTH_BANNED.has(searchKey)) {
                html = renderResult('black', '💀 绝对禁止 (有毒/红线)', '该物品属于《保健食品禁用物品》或涉毒原料！具有明显毒性或严重副作用，严禁用于任何食品。');
            }
            
            // 2. 🚫 明确批复非食品 (复函负面清单)
            else if (DATA.EXPLICIT_NON_FOOD[input] || DATA.EXPLICIT_NON_FOOD[searchKey]) {
                // 优先用标准名查
                let reason = DATA.EXPLICIT_NON_FOOD[searchKey] || DATA.EXPLICIT_NON_FOOD[input];
                html = renderResult('red', '🚫 禁止入菜 (卫健委批复)', `<strong>官方复函：</strong>${reason}<br><strong>结论：</strong>被明确回复“不作为”普通食品原料。`);
            }

            // 3. 👶 婴幼儿菌种
            else if (DATA.INFANT_PROBIOTICS.has(input)) {
                html = renderResult('blue', '👶 婴幼儿可用菌种', '列入《可用于婴幼儿食品的菌种名单》，安全性高。');
            }
            
            // 4. 🦠 普通菌种
            else if (DATA.PROBIOTICS.has(input)) {
                html = renderResult('blue', '🦠 合规菌种 (普通)', '列入《可用于食品的菌种名单》，可用于酸奶、饮料等。');
            }

            // 5. 💊 保健食品专用 (红灯)
            // 注意：需排除药食同源（因为部分保健原料已转正，如西洋参）
            else if ((DATA.HEALTH_ONLY.has(input) || DATA.HEALTH_ONLY.has(searchKey)) && !HOMOLOGY_SET.has(searchKey)) {
                html = renderResult('red', '💊 禁止入菜 (仅限保健)', '属于《可用于保健食品的物品名单》，且不是药食同源。仅限保健食品生产，餐饮环节违法！');
            }

            // 6. 🌿 药食同源 (绿灯) - 使用 searchKey 匹配
            else if (HOMOLOGY_SET.has(searchKey)) {
                html = renderResult('green', '🌿 药食同源 (合法)', '列入卫健委《既是食品又是中药材的物质名单》。<br><strong>结论：</strong>具有合法食品身份，可用于餐饮。');
            }

            // 7. 🥦 普通食品 / 香辛料
            else if (DATA.ORDINARY.has(input) || DATA.ORDINARY_APPROVED[input] || DATA.ORDINARY_APPROVED[searchKey]) {
                let detail = DATA.ORDINARY_APPROVED[searchKey] || DATA.ORDINARY_APPROVED[input] || "传统食品原料/农副产品";
                html = renderResult('green', '🥦 普通食品', detail + '<br>结论：无需限制，可按需使用。');
            }
            else if (DATA.SPICE.has(input) || DATA.SPICE.has(searchKey)) {
                html = renderResult('green', '🌶️ 国标香辛料', 'GB/T 12729.1-2008。结论：合法调味品。');
            }

            // 8. 🧪 新资源 (黄灯)
            else if (DATA.NEW_RESOURCE[input] || DATA.NEW_RESOURCE[searchKey]) {
                let d = DATA.NEW_RESOURCE[searchKey] || DATA.NEW_RESOURCE[input];
                html = renderResult('yellow', '🧪 有条件食用', `<strong>限量：</strong>${d.limit}<br><strong>禁忌：</strong>${d.risk}`);
            }

            // 9. 📕 药典黑名单
            else if (DATA.CHP.has(input) || DATA.CHP.has(searchKey)) {
                html = renderResult('red', '🚫 禁止入菜 (纯药品)', '收录于《中国药典》且未列入食品白名单。属于“纯中药材”，餐饮环节严禁使用！');
            }

            // 10. 未知
            else {
                html = renderResult('red', '❓ 未收录 / 慎用', '系统未在任何白名单中找到该物品。若为中药材或野生菌，默认禁止使用。');
            }

            view.innerHTML = aliasTip + html;
            view.style.display = 'block';

        } catch (e) {
            alert("查询逻辑出错: " + e.message);
        }
    }

    function renderResult(color, title, desc) {
        let iconMap = { green: '🛡️', blue: '✅', yellow: '⚠️', red: '🚫', black: '💀' };
        return `
            <div class="${color}">
                <div class="res-header">
                    <span class="res-icon">${iconMap[color]||'❓'}</span>
                    <h2 class="res-title">${title}</h2>
                </div>
                <div class="risk-alert">${desc}</div>
            </div>`;
    }

    // ==========================================
    // 💾 其他核心数据库 (保持 V21.0 数据)
    // ==========================================
    const DATA = {
