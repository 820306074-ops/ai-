<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧食堂后厨监管驾驶舱</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- 引入 Chart.js 用于渲染图表 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- 配置 Tailwind 科技深蓝主题色 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ref: {
                            bg: '#080d1c',        /* 深邃背景色 */
                            panel: '#10172a',     /* 卡片背景色 */
                            panelHover: '#16203a',
                            cyan: '#00e5ff',      /* 高亮青色 */
                            blue: '#3b82f6',
                            alertBg: '#3f181f',   /* 偏低/异常 红色背景 */
                            alertText: '#ff6b6b', /* 异常红字 */
                            normalBg: '#133526',  /* 正常 绿色背景 */
                            normalText: '#20c997',/* 正常绿字 */
                            textMain: '#f8fafc',
                            textSub: '#94a3b8'
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        /* 基础样式与深色背景 */
        body {
            background-color: #080d1c;
            background-image: 
                radial-gradient(circle at 50% 0%, #172554 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, #0f172a 0%, transparent 50%);
            color: #f8fafc;
            overflow: hidden; /* 强制不出现整体滚动条 */
        }

        /* 隐藏元素的滚动条但保持可滚动 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 圆润拟物态卡片 */
        .glass-panel {
            background: linear-gradient(180deg, rgba(23, 33, 56, 0.8) 0%, rgba(13, 20, 36, 0.9) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border-radius: 20px; /* 大圆角 */
            position: relative;
            overflow: hidden;
        }

        /* 标题指示线 */
        .title-indicator {
            width: 4px;
            height: 16px;
            background: #00e5ff;
            border-radius: 4px;
            box-shadow: 0 0 8px #00e5ff;
        }

        /* 独立数据行胶囊卡片 */
        .data-pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .data-pill:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 229, 255, 0.3);
        }

        /* 自动滚动动画 */
        .scroll-container { overflow: hidden; position: relative; }
        .scroll-content { animation: scrollUp 25s linear infinite; }
        .scroll-container:hover .scroll-content { animation-play-state: paused; }
        @keyframes scrollUp {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        /* 状态呼吸动画 */
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px currentColor); }
            50% { opacity: 0.5; filter: none; }
        }
        .animate-alert { animation: pulse-glow 1.5s infinite; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col p-4 md:p-6 text-sm gap-4">

    <!-- JavaScript 逻辑交互 -->
    <script>
        // 1. 时钟功能
        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleTimeString('zh-CN', { hour12: false });
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            document.getElementById('current-date').innerText = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} 星期${days[now.getDay()]}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 2. 本地图片上传与缓存功能 (带自动压缩黑科技)
        function displayImage(imageSrc) {
            const imgElement = document.getElementById('mainImage');
            const overlay = document.getElementById('uploadOverlay');
            const placeholderContent = document.getElementById('placeholderContent');
            
            imgElement.src = imageSrc;
            imgElement.classList.remove('hidden');
            
            // 改变上传区域的样式为：平常透明，鼠标悬停时显示黑底和更换提示
            overlay.className = 'absolute inset-0 flex flex-col items-center justify-center z-20 transition-all duration-300 opacity-0 group-hover:opacity-100 bg-black/60 backdrop-blur-sm';
            placeholderContent.innerHTML = `
                <i class="ph ph-arrows-clockwise text-5xl mb-3 text-white"></i>
                <span class="tracking-widest text-sm font-bold text-white">点击更换全景图（无大小限制）</span>
            `;
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 1. 立即使用本地 URL 显示极清原图，绝不卡顿
            const objectURL = URL.createObjectURL(file);
            displayImage(objectURL);

            // 2. 在后台静默进行智能压缩并存入 localStorage 缓存，完美绕过 5MB 限制
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    // 限制最大宽高到 1920，保证大屏够用且不会撑爆缓存
                    const MAX_WIDTH = 1920;
                    const MAX_HEIGHT = 1080;
                    
                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height = Math.round(height * MAX_WIDTH / width);
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width = Math.round(width * MAX_HEIGHT / height);
                            height = MAX_HEIGHT;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // 输出为 80% 质量的 JPEG，可将体积缩小 90% 以上
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    
                    try {
                        localStorage.setItem('dashboardMainImage', compressedBase64);
                    } catch (error) {
                        console.error('浏览器缓存空间仍不足:', error);
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);

            // 清空 input value，确保下次选同一张图也能触发 change 事件
            event.target.value = '';
        }

        // 页面加载时检查并恢复图片
        function loadCachedImage() {
            const cachedImage = localStorage.getItem('dashboardMainImage');
            if (cachedImage) {
                displayImage(cachedImage);
            }
        }

        // 3. 初始化图表 (Chart.js 还原参考图 + 多条折线与尾部温度显示)
        function initChart() {
            const ctx = document.getElementById('tempChart').getContext('2d');
            
            // 辅助函数：创建渐变填充背景
            const createGradient = (r, g, b) => {
                let gradient = ctx.createLinearGradient(0, 0, 0, 150);
                gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.4)`);
                gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0.01)`);
                return gradient;
            };

            // 自定义插件：在最后一条折线末端显示数值和名称
            const lastPointLabelPlugin = {
                id: 'lastPointLabel',
                afterDatasetsDraw(chart) {
                    const { ctx } = chart;
                    chart.data.datasets.forEach((dataset, i) => {
                        const meta = chart.getDatasetMeta(i);
                        if (!meta.hidden && meta.data.length > 0) {
                            const lastPoint = meta.data[meta.data.length - 1];
                            const value = dataset.data[dataset.data.length - 1];

                            ctx.save();
                            // 绘制温度数值 (跟图例线同色)
                            ctx.fillStyle = dataset.borderColor;
                            ctx.font = 'bold 13px "JetBrains Mono", monospace';
                            ctx.textAlign = 'left';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(`${value}℃`, lastPoint.x + 8, lastPoint.y - 8);

                            // 绘制设备名称 (副文本色)
                            ctx.fillStyle = '#94a3b8';
                            ctx.font = '10px "Noto Sans SC", sans-serif';
                            ctx.fillText(dataset.label, lastPoint.x + 8, lastPoint.y + 8);
                            ctx.restore();
                        }
                    });
                }
            };

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['08:00', '10:00', '12:00', '14:00', '16:00', '18:00'],
                    datasets: [
                        {
                            label: '冷藏冰箱',
                            data: [4.1, 5.5, 3.2, 6.8, 4.3, 7.0],
                            borderColor: '#00e5ff', // 亮青色
                            backgroundColor: createGradient(0, 229, 255),
                            borderWidth: 2,
                            pointBackgroundColor: '#080d1c',
                            pointBorderColor: '#00e5ff',
                            pointBorderWidth: 2,
                            pointRadius: 3,
                            pointHoverRadius: 6,
                            fill: true,
                            tension: 0.4 // 平滑曲线
                        },
                        {
                            label: '凉菜专柜',
                            data: [6.5, 7.2, 5.8, 8.1, 6.4, 7.5],
                            borderColor: '#3b82f6', // 经典蓝
                            backgroundColor: createGradient(59, 130, 246),
                            borderWidth: 2,
                            pointBackgroundColor: '#080d1c',
                            pointBorderColor: '#3b82f6',
                            pointBorderWidth: 2,
                            pointRadius: 3,
                            pointHoverRadius: 6,
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: '生肉留样',
                            data: [2.1, 3.5, 1.2, 4.8, 2.3, 3.0],
                            borderColor: '#20c997', // 安全绿
                            backgroundColor: createGradient(32, 201, 151),
                            borderWidth: 2,
                            pointBackgroundColor: '#080d1c',
                            pointBorderColor: '#20c997',
                            pointBorderWidth: 2,
                            pointRadius: 3,
                            pointHoverRadius: 6,
                            fill: true,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: {
                            right: 60 // 右侧留出空间，防止最后的文字被切掉
                        }
                    },
                    plugins: { 
                        legend: { display: false }, // 隐藏顶部图例，利用尾部标签替代
                        tooltip: { 
                            mode: 'index', 
                            intersect: false, 
                            backgroundColor: 'rgba(16, 23, 42, 0.9)', 
                            titleColor: '#94a3b8'
                        } 
                    },
                    scales: {
                        y: { 
                            min: 0, max: 10, 
                            grid: { color: 'rgba(255, 255, 255, 0.05)', drawBorder: false },
                            ticks: { color: '#94a3b8', stepSize: 2, padding: 10 }
                        },
                        x: { 
                            grid: { display: false, drawBorder: false },
                            ticks: { color: '#94a3b8', padding: 10 }
                        }
                    },
                    interaction: { mode: 'nearest', axis: 'x', intersect: false }
                },
                plugins: [lastPointLabelPlugin] // 注册上面写的自定义文字插件
            });
        }

        // 4. 渲染右侧和左下方的胶囊列表
        const fridges = [
            { id: '早餐', name: '生肉留样柜', temp: 2.5, status: '正常' },
            { id: '午餐', name: '凉菜专间柜', temp: 4.5, status: '正常' },
            { id: '午餐', name: '半成品冷藏', temp: 9.1, status: '偏高' },
            { id: '晚餐', name: '奶制品冷柜', temp: 5.0, status: '正常' },
            { id: '晚餐', name: '熟食保温柜', temp: 68.5, status: '偏低' },
            { id: '全天', name: '深冷冷冻库', temp: -18.5, status: '正常' }
        ];

        function renderFridges() {
            const container = document.getElementById('fridge-list');
            container.innerHTML = '';
            
            [...fridges, ...fridges].forEach((f, idx) => {
                let isWarn = f.status !== '正常';
                let badgeClass = isWarn ? 'bg-ref-alertBg text-ref-alertText border-ref-alertText/30' : 'bg-ref-normalBg text-ref-normalText border-ref-normalText/30';
                let tempColor = isWarn ? 'text-ref-alertText' : 'text-white';

                container.innerHTML += `
                    <div class="data-pill flex items-center p-2.5 px-3">
                        <div class="w-10 text-xs text-ref-textSub border-r border-white/10 mr-3 shrink-0">${f.id}</div>
                        <div class="flex-1 text-white text-sm truncate">${f.name}</div>
                        <div class="w-16 text-center font-mono font-bold ${tempColor}">${f.temp}°C</div>
                        <div class="w-14 text-right shrink-0">
                            <span class="text-xs px-2 py-0.5 rounded-full border ${badgeClass}">${f.status}</span>
                        </div>
                    </div>
                `;
            });
        }

        const disinfectRecords = [
            { time: '08:00 - 08:45', dev: '1号消毒柜', result: '合格' },
            { time: '09:30 - 10:15', dev: '2号保洁柜', result: '合格' },
            { time: '11:00 - 11:30', dev: '洗碗机高温', result: '合格' },
            { time: '13:00 - 13:45', dev: '1号消毒柜', result: '待复核' },
            { time: '15:00 - 15:30', dev: '专间紫外线', result: '进行中' }
        ];

        function renderDisinfect() {
            const container = document.getElementById('disinfect-list');
            container.innerHTML = '';
            
            [...disinfectRecords, ...disinfectRecords].forEach(r => {
                let rClass = r.result === '合格' ? 'bg-ref-normalBg text-ref-normalText border-ref-normalText/30' : (r.result === '进行中' ? 'bg-blue-900/40 text-blue-400 border-blue-400/30' : 'bg-orange-900/40 text-orange-400 border-orange-400/30');

                container.innerHTML += `
                    <div class="data-pill flex items-center p-2.5 px-3">
                        <div class="col-span-5 w-28 text-ref-textSub font-mono text-xs shrink-0">${r.time}</div>
                        <div class="col-span-4 flex-1 text-white text-sm text-center truncate">${r.dev}</div>
                        <div class="col-span-3 w-16 text-right shrink-0">
                            <span class="text-[10px] px-2 py-0.5 rounded-full border ${rClass}">${r.result}</span>
                        </div>
                    </div>
                `;
            });
        }

        const alerts = [
            { type: '紫外线状态', desc: '裱花间灯管运行完毕已关闭', time: '10分钟前', level: 'info' },
            { type: '温度预警', desc: '半成品冷藏柜温度达到9.1℃', time: '15分钟前', level: 'high' },
            { type: '设备提示', desc: '2号保洁柜按计划需进行消毒', time: '1小时前', level: 'info' }
        ];

        function renderAlerts() {
            const container = document.getElementById('alert-list');
            container.innerHTML = '';

            alerts.forEach(a => {
                let isHigh = a.level === 'high';
                let iconClass = isHigh ? 'text-ref-alertText bg-ref-alertBg border-ref-alertText/30 animate-alert' : 'text-blue-400 bg-blue-900/40 border-blue-400/30';
                let icon = a.type.includes('温度') ? 'ph-thermometer-hot' : (a.type.includes('紫外线') ? 'ph-lightbulb' : 'ph-info');

                container.innerHTML += `
                    <div class="data-pill flex items-start gap-3 p-3 border-l-4 ${isHigh ? 'border-l-ref-alertText' : 'border-l-blue-400'}">
                        <div class="w-8 h-8 rounded-full border flex items-center justify-center shrink-0 ${iconClass}">
                            <i class="ph ${icon} text-lg"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-white text-sm font-bold ${isHigh ? 'text-red-300' : ''}">${a.type}</span>
                                <span class="text-ref-textSub text-[10px]">${a.time}</span>
                            </div>
                            <div class="text-ref-textSub text-xs truncate" title="${a.desc}">${a.desc}</div>
                        </div>
                    </div>
                `;
            });
        }

        // 5. 新增：模拟 AI 分析打字机效果，供后期接入真实 API
        const aiInsights = [
            "【预警研判】当前冷链温度整体达标，仅「半成品冷藏」温度（9.1℃）偏高。系统研判：可能因备餐期频繁开门导致。建议后厨主管现场核实冷柜密封状态。",
            "【设备体检】12台物联监控设备全部在线，网络延迟正常。餐具消毒任务执行良好，专间紫外线消毒按计划执行中，整体设备健康度 100%。",
            "【综合态势】今日食安综合评分 98 分。结合传感器数据：凉菜间与生肉处理区环境指标正常，整体食安风险处于「极低」水平。",
            "【效率建议】结合历史画像分析，即将进入午市高峰期。建议：提前开启二号排烟系统，并关注熟食保温柜温度曲线，确保核心菜品中心温度达标。"
        ];
        let currentAiIndex = 0;
        let aiTypingTimer = null;

        function runAITyping() {
            const text = aiInsights[currentAiIndex];
            const container = document.getElementById('ai-analysis-text');
            const timeEl = document.getElementById('ai-time');
            
            container.innerHTML = '<span class="text-ref-cyan font-bold">_</span>';
            timeEl.innerText = '分析计算中...';
            
            let charIdx = 0;
            clearInterval(aiTypingTimer);
            
            aiTypingTimer = setInterval(() => {
                if (charIdx <= text.length) {
                    let currentStr = text.substring(0, charIdx);
                    
                    // 正则替换高亮预警/正常词汇（在字符打出的过程中即时变色）
                    currentStr = currentStr.replace(/(9\.1℃|偏高|预警|异常)/g, '<span class="text-ref-alertText font-bold">$1</span>');
                    currentStr = currentStr.replace(/(98 分|极低|达标|良好|100%|正常)/g, '<span class="text-ref-normalText font-bold">$1</span>');
                    currentStr = currentStr.replace(/(【.*?】)/g, '<span class="text-white font-bold">$1</span>');
                    
                    container.innerHTML = currentStr + '<span class="text-ref-cyan font-bold animate-pulse">_</span>';
                    charIdx++;
                } else {
                    clearInterval(aiTypingTimer);
                    timeEl.innerText = '分析完成 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
                    container.innerHTML = container.innerHTML.replace('<span class="text-ref-cyan font-bold animate-pulse">_</span>', ''); // 打字结束移除光标
                    
                    // 为下一次播放做准备
                    currentAiIndex = (currentAiIndex + 1) % aiInsights.length;
                }
            }, 50); // 每50毫秒打出一个字，模拟流式输出
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadCachedImage(); // 检查缓存
            initChart();
            renderFridges();
            renderDisinfect();
            renderAlerts();
            
            // 延迟两秒启动 AI 打字机分析，之后每隔 15 秒轮换一条分析
            setTimeout(() => {
                runAITyping();
                setInterval(runAITyping, 15000);
            }, 2000);
        });

    </script>
</body>
</html>
