<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每月食品安全调度会议纪要 - 打印专用修复版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        /* 基础页面重置 */
        html, body { 
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif; 
            background-color: #f3f4f6; 
            margin: 0; padding: 0;
            overscroll-behavior: none; 
        }
        
        /* ================================================================
           核心修复：PDF/打印 专用排版规则 
           ================================================================
        */

        /* 规则一：A4纸张容器 - 移除所有阴影和背景干扰 */
        #previewPaper {
            width: 210mm; 
            min-height: 297mm; 
            background-color: #ffffff; /* 强制纯白 */
            margin: 30px auto; 
            padding: 15mm 31mm; /* 调整：上下padding减小，改由PDF margin控制，防止双重留白 */
            /* 屏幕预览时保留阴影以便区分，但在PDF生成模式下会通过JS移除 */
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            font-family: "SimSun", "Songti SC", serif; 
            color: #000;
            line-height: 1.6;
            font-size: 16px; 
            box-sizing: border-box;
            position: relative; /* 必须是 relative，不能是 fixed/absolute */
            z-index: 1;
        }

        /* 规则二：防止遮挡 - 强制正文层级最高 */
        /* 关键修复：提升所有文本元素的层级，防止被背景渲染错误遮挡 */
        #previewPaper p, 
        #previewPaper div, 
        #previewPaper h1, 
        #previewPaper h2, 
        #previewPaper h3, 
        #previewPaper span, 
        #previewPaper li,
        #previewPaper td {
            position: relative;
            z-index: 10;
        }

        /* 规则三：移除网页装饰 - 章节标题改为文档风格 */
        .doc-section-title { 
            font-family: 'SimHei', sans-serif; 
            font-weight: bold; 
            font-size: 18px; 
            margin-top: 24px; 
            margin-bottom: 12px;
            /* 关键：使用边框分割，代替背景色块 */
            border-bottom: 1px solid #000; 
            padding-bottom: 4px;
            background: none !important; /* 禁止背景色 */
        }

        /* 规则四：表格样式 - 纯黑白边框 */
        .doc-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-bottom: 20px; 
            font-size: 16px;
            background: #fff;
        }
        .doc-table td { 
            border: 1px solid #000; 
            padding: 8px 10px; 
            vertical-align: middle; 
            background: transparent !important; /* 防止单元格背景变黑 */
            position: relative; 
            z-index: 10;
        }
        .doc-label-cell { 
            font-family: 'SimHei', sans-serif; 
            font-weight: bold; 
            width: 110px; 
            text-align: center; 
            background-color: transparent !important; /* 移除灰底，防止变黑 */
        }

        /* 排版辅助类 */
        .doc-header-right { text-align: right; font-size: 14px; margin-bottom: 5px; font-family: 'SimHei', sans-serif; }
        .doc-title { 
            text-align: center; font-size: 28px; font-weight: bold; 
            font-family: 'SimHei', sans-serif; margin-bottom: 25px; 
            margin-top: 10px; letter-spacing: 2px;
        }
        .doc-record-no { margin-bottom: 10px; font-family: "SimSun"; font-size: 14px; }
        .doc-text { 
            text-align: justify; 
            margin-bottom: 8px; 
            text-indent: 2em; 
            line-height: 1.8; /* 增加行高，提升阅读体验 */
        }
        .doc-text-bold { font-weight: bold; font-family: 'SimHei'; }
        
        /* 下划线 - 确保是纯黑色 */
        .u-line { 
            border-bottom: 1px solid #000; 
            padding: 0 4px; 
            font-family: "SimSun"; 
            display: inline-block; 
            min-width: 30px; 
            text-align: center; 
            color: #000;
        }
        
        .doc-footer { margin-top: 60px; display: flex; justify-content: space-between; page-break-inside: avoid; }
        
        /* 规则五：分页控制 - 防止文字切断 */
        .keep-together { page-break-inside: avoid; break-inside: avoid; }

        /* 预览遮罩层 */
        #previewOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #374151; z-index: 50; overflow-y: auto; padding-bottom: 80px;
        }

        /* 移动端适配 */
        @media (max-width: 800px) {
            #previewPaper { width: 95%; padding: 15px; margin: 10px auto; zoom: 0.6; }
        }

        /* ================================================================
           PDF 生成时的专用状态类 (.pdf-generating)
           由 JS 在生成前添加，生成后移除
           ================================================================ 
        */
        .pdf-generating #previewPaper {
            margin: 0 !important;
            padding: 0 31mm !important; /* 生成时只保留左右padding，上下由margin控制 */
            box-shadow: none !important; /* 彻底移除阴影，防止黑条 */
            border: none !important;
            background-color: #ffffff !important;
        }

        /* 强制移除分页处的装饰 */
        .pdf-generating * {
            box-decoration-break: clone;
            background-color: transparent !important; /* 除非特指，全部透明 */
        }
        
        /* 恢复容器白底 */
        .pdf-generating #previewPaper {
            background-color: #ffffff !important;
        }

        /* 禁用绝对定位，防止跨页飞出 */
        .pdf-generating .doc-text, 
        .pdf-generating .doc-section-title,
        .pdf-generating table {
            position: static !important; 
            float: none !important;
        }

        /* 隐藏装饰性伪元素 */
        .pdf-generating *::before,
        .pdf-generating *::after {
            display: none !important;
        }
        
        /* 动画 */
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="pb-32">

    <!-- 顶部导航 -->
    <header class="fixed top-0 left-0 right-0 bg-white shadow-lg z-40 h-20 no-print">
        <div class="flex justify-between items-center px-6 py-3 bg-blue-700 text-white h-full">
            <div>
                <h1 class="text-xl font-bold flex items-center">
                    <i class="fa-solid fa-utensils mr-3"></i>
                    每月食品安全调度会议纪要
                </h1>
                <p class="text-xs opacity-80">自动化生成 | 强制校验 | 纯净版排版</p>
            </div>
        </div>
    </header>

    <div class="h-20 no-print"></div>

    <!-- 表单区域 -->
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 no-print" id="mainFormContainer">
        
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h2 class="text-gray-700 font-bold mb-4 border-l-4 border-blue-600 pl-3 text-lg">会议基本信息</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-bold text-gray-800 mb-2">记录编号</label>
                    <input type="text" id="recordNo" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" placeholder="例如：20260116">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-800 mb-2">会议年份</label>
                    <input type="number" id="meetingYear" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" value="2026">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-800 mb-2">会议月份</label>
                    <input type="number" id="meetingMonth" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" value="2">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-800 mb-2">主持人</label>
                    <input type="text" id="host" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" placeholder="输入姓名" value="李川">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-800 mb-2">会议日期</label>
                    <input type="date" id="meetingDate" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm cursor-pointer">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-800 mb-2">开始时间</label>
                        <input type="time" id="startTime" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" value="14:00">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-800 mb-2">结束时间</label>
                        <input type="time" id="endTime" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" value="15:30">
                    </div>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-sm font-bold text-gray-800 mb-2">会议地点</label>
                    <input type="text" id="location" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" value="办公室">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-bold text-gray-800 mb-2">出席人员</label>
                    <input type="text" id="attendees" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" placeholder="张三、李四、王五...">
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h2 class="text-gray-700 font-bold mb-4 border-l-4 border-blue-600 pl-3 text-lg">一、食品安全管理工作情况汇报</h2>
            
            <div class="mb-6 max-w-md">
                <label class="block text-sm font-bold text-gray-800 mb-2"><span class="text-red-600 mr-1">*</span>汇报人</label>
                <input type="text" id="reporter1" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm border-blue-300" placeholder="此项必填">
            </div>

            <div class="bg-blue-50 p-5 rounded-lg mb-6 border border-blue-100">
                <h3 class="font-bold text-blue-800 mb-4 text-lg border-b border-blue-200 pb-2">1. 食品原料验收情况</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-6">
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">到货总批数</label>
                        <input type="number" id="rmTotal" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm mt-1" value="30" oninput="calcRmRate()">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">合格批数</label>
                        <input type="number" id="rmQualified" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm mt-1" value="29" oninput="calcRmRate()">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">不合格数</label>
                        <input type="text" id="rmUnqualified" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm bg-gray-100 cursor-not-allowed text-gray-500 mt-1" readonly value="1">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">合格率</label>
                        <input type="text" id="rmRate" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm bg-gray-100 cursor-not-allowed text-gray-500 mt-1" readonly value="96.7%">
                    </div>
                </div>
                <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
                    <label class="block text-sm font-bold text-blue-900 mb-3"><i class="fa-solid fa-pen-to-square mr-1"></i> 不合格项详情描述</label>
                    <div class="mb-4">
                        <label class="block text-sm font-bold text-gray-600 mb-2">不合格原料为：</label>
                        <textarea id="rmBadName" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" rows="2" placeholder="例如：1月6日购进的生菜（若全合格则填“无”）"></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-bold text-gray-600 mb-2">不合格原因为：</label>
                        <textarea id="rmBadReason" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" rows="2" placeholder="例如：农残快速检测超标（若无则填“无”）"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-2">采取的处理措施：</label>
                        <textarea id="rmBadMeasure" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" rows="3" placeholder="例如：当场拒收，退货处理（若无则填“无”）"></textarea>
                    </div>
                </div>
            </div>

            <div class="bg-indigo-50 p-5 rounded-lg mb-6 border border-indigo-100">
                <h3 class="font-bold text-indigo-800 mb-4 text-lg border-b border-indigo-200 pb-2">2. 投诉处理情况</h3>
                
                <div class="grid grid-cols-3 gap-6 mb-6">
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">投诉总起数</label>
                        <input type="number" id="compTotal" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm mt-1" value="0" oninput="calcCompInvalid()">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">有效投诉</label>
                        <input type="number" id="compEffective" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm mt-1" value="0" oninput="calcCompInvalid()">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">无效投诉</label>
                        <input type="number" id="compInvalid" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm bg-gray-100 cursor-not-allowed text-gray-500 mt-1" readonly value="0">
                    </div>
                </div>

                <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
                    <label class="block text-sm font-bold text-indigo-900 mb-3"><i class="fa-solid fa-pen-to-square mr-1"></i> 投诉详情描述</label>
                    <div class="mb-4">
                        <label class="block text-sm font-bold text-gray-600 mb-2">投诉产品主要为：</label>
                        <input type="text" id="compProduct" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" placeholder="例如：红烧肉、米饭（若无投诉则填“无”）">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-bold text-gray-600 mb-2">投诉主要原因为：</label>
                        <input type="text" id="compReason" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" placeholder="例如：发现异物/口感不佳（若无投诉则填“无”）">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-2">采取的主要改进措施为：</label>
                        <textarea id="compMeasure" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" rows="2" placeholder="例如：对厨师进行批评教育，加强出餐检查（若无投诉则填“无”）"></textarea>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div class="bg-green-50 p-5 rounded-lg border border-green-100 flex flex-col">
                    <h3 class="font-bold text-green-800 mb-3 text-lg border-b border-green-200 pb-1">3. 供应商管理</h3>
                    <label class="block text-sm font-bold text-gray-600 mb-2">本月对供应商审核情况：</label>
                    <textarea id="supplierStatus" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm flex-grow" rows="4" placeholder="例如：本月对3家米面粮油供应商资质进行了年度复审，全部合格。"></textarea>
                </div>
                <div class="bg-orange-50 p-5 rounded-lg border border-orange-100">
                    <h3 class="font-bold text-orange-800 mb-3 text-lg border-b border-orange-200 pb-1">4. 培训情况</h3>
                    <div class="space-y-4">
                        <div><label class="block text-sm font-bold text-gray-600 mb-2">本月开展培训次数：</label><input type="number" id="trainTimes" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" value="1"></div>
                        <div><label class="block text-sm font-bold text-gray-600 mb-2">合计学时：</label><input type="number" id="trainHours" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" value="2"></div>
                        <div><label class="block text-sm font-bold text-gray-600 mb-2">参加培训人员合计：</label><input type="number" id="trainPeople" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" value="15"></div>
                    </div>
                </div>
            </div>

            <div class="bg-gray-50 p-5 rounded-lg border border-gray-200">
                <h3 class="font-bold text-blue-800 mb-4 text-lg border-b border-gray-300 pb-1">5. 日管控检查问题落实</h3>
                <div class="grid grid-cols-3 gap-6 mb-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-2">本月问题总数</label>
                        <input type="number" id="checkTotal" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" value="5" oninput="calcCheckPending()">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-2">已落实整改数</label>
                        <input type="number" id="checkFixed" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" value="5" oninput="calcCheckPending()">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-2">待整改数</label>
                        <input type="number" id="checkPending" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm bg-gray-100 cursor-not-allowed text-gray-500" readonly value="0">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-2">计划完成整改时间</label>
                        <input type="date" id="checkDeadline" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-2">相关责任部门配合情况</label>
                        <input type="text" id="checkCoop" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm" value="各部门配合良好，整改及时。">
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 gap-6">
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-center mb-4 border-l-4 border-red-600 pl-3">
                    <h2 class="text-gray-700 font-bold text-lg">二、较大风险隐患排查情况</h2>
                    <button onclick="addListItem('riskList')" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded font-bold transition flex items-center shadow">
                        <i class="fa-solid fa-plus mr-1"></i> 添加隐患
                    </button>
                </div>
                <div id="riskList" class="space-y-4">
                    <div class="flex gap-4 items-center">
                        <span class="font-bold text-gray-400 w-6 text-right">1.</span>
                        <input type="text" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm flex-grow" value="部分从业人员健康证即将到期">
                        <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash fa-lg"></i></button>
                    </div>
                    <div class="flex gap-4 items-center">
                        <span class="font-bold text-gray-400 w-6 text-right">2.</span>
                        <input type="text" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm flex-grow" value="仓库通风设备噪音较大">
                        <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash fa-lg"></i></button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-center mb-4 border-l-4 border-indigo-600 pl-3">
                    <h2 class="text-gray-700 font-bold text-lg">三、部门发言及共识</h2>
                    <button onclick="addListItem('consensusList')" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded font-bold transition flex items-center shadow">
                        <i class="fa-solid fa-plus mr-1"></i> 添加条目
                    </button>
                </div>
                <div id="consensusList" class="space-y-4">
                    <div class="flex gap-4 items-center">
                        <span class="font-bold text-gray-400 w-6 text-right">1.</span>
                        <input type="text" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm flex-grow" value="各部门表示将全力配合食品安全整改工作。">
                        <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash fa-lg"></i></button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-center mb-4 border-l-4 border-yellow-600 pl-3">
                    <h2 class="text-gray-700 font-bold text-lg">四、企业主要负责人工作要求</h2>
                    <button onclick="addListItem('reqList')" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded font-bold transition flex items-center shadow">
                        <i class="fa-solid fa-plus mr-1"></i> 添加要求
                    </button>
                </div>
                <div class="mb-4 max-w-md">
                    <label class="block text-sm font-bold text-gray-800 mb-2"><span class="text-red-600 mr-1">*</span>负责人姓名</label>
                    <input type="text" id="leaderName" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm border-blue-300" placeholder="此项必填">
                </div>
                <div id="reqList" class="space-y-4">
                    <div class="flex gap-4 items-center">
                        <span class="font-bold text-gray-400 w-6 text-right">1.</span>
                        <input type="text" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm flex-grow" value="必须严格落实日管控、周排查制度。">
                        <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash fa-lg"></i></button>
                    </div>
                    <div class="flex gap-4 items-center">
                        <span class="font-bold text-gray-400 w-6 text-right">2.</span>
                        <input type="text" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm flex-grow" value="对排查出的隐患要举一反三，彻底整改。">
                        <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash fa-lg"></i></button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md p-6 mb-32">
                <div class="flex justify-between items-center mb-4 border-l-4 border-green-600 pl-3">
                    <h2 class="text-gray-700 font-bold text-lg">五、下个月重点工作计划</h2>
                    <button onclick="addListItem('planList')" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded font-bold transition flex items-center shadow">
                        <i class="fa-solid fa-plus mr-1"></i> 添加计划
                    </button>
                </div>
                <div id="planList" class="space-y-4">
                    <div class="flex gap-4 items-center">
                        <span class="font-bold text-gray-400 w-6 text-right">1.</span>
                        <input type="text" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm flex-grow" value="开展春季传染病预防专题培训。">
                        <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash fa-lg"></i></button>
                    </div>
                    <div class="flex gap-4 items-center">
                        <span class="font-bold text-gray-400 w-6 text-right">2.</span>
                        <input type="text" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm flex-grow" value="对后厨设备进行全面检修。">
                        <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash fa-lg"></i></button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- 底部按钮 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 z-40 flex gap-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] no-print">
        <button onclick="resetForm()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-4 rounded-lg transition text-base">
            <i class="fa-solid fa-rotate-left mr-2"></i>重置
        </button>
        <button onclick="showReportPreview()" class="flex-[2] bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition text-base">
            <i class="fa-solid fa-file-signature mr-2"></i>预览 / 导出
        </button>
    </div>

    <div id="previewOverlay" class="hidden">
        <!-- 打印区域 -->
        <div id="previewPaper"></div>
        
        <!-- 底部操作栏 -->
        <div class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-700 p-4 z-50 flex gap-4 justify-center no-print">
            <button onclick="closePreview()" class="bg-gray-600 hover:bg-gray-500 text-white px-6 py-2 rounded-lg font-bold">返回修改</button>
            <button onclick="generatePDF(event)" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg font-bold shadow-lg flex items-center">
                <i class="fa-solid fa-file-pdf mr-2"></i> 导出PDF文件
            </button>
            <button onclick="generateFinalHTML(event)" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-bold shadow-lg flex items-center">
                <i class="fa-solid fa-code mr-2"></i> 导出HTML源码
            </button>
        </div>
    </div>

    <script>
        // 日期格式化
        const formatSlashString = (dateString) => {
            if (!dateString) return "____/__/__";
            const parts = dateString.split('-'); 
            if(parts.length !== 3) return dateString;
            return `${parts[0]}/${parseInt(parts[1])}/${parseInt(parts[2])}`;
        };

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            const todayISO = new Date().toISOString().split('T')[0];
            document.getElementById('meetingDate').value = todayISO;
        });

        // 逻辑计算函数
        function calcRmRate() {
            const total = parseInt(document.getElementById('rmTotal').value) || 0;
            const qual = parseInt(document.getElementById('rmQualified').value) || 0;
            const unqual = total - qual;
            document.getElementById('rmUnqualified').value = unqual >= 0 ? unqual : 0;
            if (total > 0 && qual >= 0 && qual <= total) {
                const rate = ((qual / total) * 100).toFixed(1) + '%';
                document.getElementById('rmRate').value = rate;
            } else {
                document.getElementById('rmRate').value = '';
            }
        }

        function calcCompInvalid() {
            const total = parseInt(document.getElementById('compTotal').value) || 0;
            const effective = parseInt(document.getElementById('compEffective').value) || 0;
            const invalid = total - effective;
            document.getElementById('compInvalid').value = invalid >= 0 ? invalid : 0;
        }

        function calcCheckPending() {
            const total = parseInt(document.getElementById('checkTotal').value) || 0;
            const fixed = parseInt(document.getElementById('checkFixed').value) || 0;
            const pending = total - fixed;
            document.getElementById('checkPending').value = pending >= 0 ? pending : 0;
        }

        function addListItem(containerId) {
            const container = document.getElementById(containerId);
            const count = container.children.length + 1;
            const div = document.createElement('div');
            div.className = 'flex gap-4 items-center animate-fade-in';
            div.innerHTML = `
                <span class="font-bold text-gray-400 w-6 text-right">${count}.</span>
                <input type="text" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white shadow-sm flex-grow" placeholder="输入内容...">
                <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash fa-lg"></i></button>
            `;
            container.appendChild(div);
        }

        // 生成预览
        function showReportPreview() {
            const rep1 = document.getElementById('reporter1').value;
            const leaderName = document.getElementById('leaderName').value;

            if (!rep1 || !rep1.trim()) {
                alert('请填写【汇报人】姓名！');
                document.getElementById('reporter1').focus();
                document.getElementById('reporter1').scrollIntoView({behavior: "smooth", block: "center"});
                return;
            }
            if (!leaderName || !leaderName.trim()) {
                alert('请填写【负责人姓名】！');
                document.getElementById('leaderName').focus();
                document.getElementById('leaderName').scrollIntoView({behavior: "smooth", block: "center"});
                return;
            }

            const recordNo = document.getElementById('recordNo').value || "________";
            const year = document.getElementById('meetingYear').value || "____";
            const month = document.getElementById('meetingMonth').value || "__";
            const host = document.getElementById('host').value || "________";
            const mDate = formatSlashString(document.getElementById('meetingDate').value);
            const startT = document.getElementById('startTime').value || "__:__";
            const endT = document.getElementById('endTime').value || "__:__";
            const loc = document.getElementById('location').value || "________";
            const att = document.getElementById('attendees').value || "________";

            const rmTotal = document.getElementById('rmTotal').value || "_";
            const rmQual = document.getElementById('rmQualified').value || "_";
            const rmUnqual = document.getElementById('rmUnqualified').value || "_";
            const rmRate = document.getElementById('rmRate').value || "_%";
            const rmName = document.getElementById('rmBadName').value || "无";
            const rmReason = document.getElementById('rmBadReason').value || "无";
            const rmMeasure = document.getElementById('rmBadMeasure').value || "无";

            const cpTotal = document.getElementById('compTotal').value || "0";
            const cpEff = document.getElementById('compEffective').value || "0";
            const cpInv = document.getElementById('compInvalid').value || "0";
            const cpProd = document.getElementById('compProduct').value || "无";
            const cpRes = document.getElementById('compReason').value || "无";
            const cpMeas = document.getElementById('compMeasure').value || "无";

            const sup = document.getElementById('supplierStatus').value || "无";
            const tTimes = document.getElementById('trainTimes').value || "0";
            const tHours = document.getElementById('trainHours').value || "0";
            const tPpl = document.getElementById('trainPeople').value || "0";

            const ckTot = document.getElementById('checkTotal').value || "0";
            const ckFix = document.getElementById('checkFixed').value || "0";
            const ckPen = document.getElementById('checkPending').value || "0";
            const ckDate = formatSlashString(document.getElementById('checkDeadline').value);
            const ckCoop = document.getElementById('checkCoop').value || "良好";

            const getListHTML = (id) => {
                const inputs = document.querySelectorAll(`#${id} input`);
                if(inputs.length === 0) return "<div class='doc-text'>无。</div>";
                return Array.from(inputs).map((inp, idx) => `<div class="doc-text">（${idx+1}）${inp.value}；</div>`).join('');
            };

            const riskHTML = getListHTML('riskList');
            const consensusHTML = getListHTML('consensusList');
            const reqHTML = getListHTML('reqList');
            const planHTML = getListHTML('planList');

            const html = `
                <div>
                    <div class="doc-header-right">附件4</div>
                    <div class="doc-title">每月食品安全调度会议纪要</div>
                    
                    <div class="doc-record-no">记录编号：（${recordNo}）</div>
                    
                    <table class="doc-table">
                        <tr>
                            <td class="doc-label-cell">会议名称</td>
                            <td>${year}年${month}月食品安全调度会议纪要</td>
                        </tr>
                        <tr>
                            <td class="doc-label-cell">主 持 人</td>
                            <td>${host}</td>
                        </tr>
                        <tr>
                            <td class="doc-label-cell">会议日期</td>
                            <td>${mDate} &nbsp;&nbsp;&nbsp;&nbsp; ${startT} — ${endT}</td>
                        </tr>
                        <tr>
                            <td class="doc-label-cell">会议地点</td>
                            <td>${loc}</td>
                        </tr>
                        <tr>
                            <td class="doc-label-cell">出席人员</td>
                            <td>${att}</td>
                        </tr>
                    </table>

                    <div style="font-weight:bold; margin: 20px 0 10px 0; font-family: 'SimHei';">会议内容记录：</div>

                    <div class="doc-section-title keep-together">一、食品安全管理工作情况汇报（汇报人：${rep1}）</div>
                    
                    <div class="doc-text"><span class="doc-text-bold">1. 当月问题汇总及整改落实情况：</span>（见附件及日管控、周排查记录）</div>

                    <div class="doc-text"><span class="doc-text-bold">2. 食品原料验收情况：</span>本月到货总批数 <span class="u-line">${rmTotal}</span> 批次，合格 <span class="u-line">${rmQual}</span> 批次，不合格 <span class="u-line">${rmUnqual}</span> 批次，到货合格率 <span class="u-line">${rmRate}</span>。</div>
                    <div class="doc-text">不合格原料为：${rmName}，不合格原因：${rmReason}，对不合格原料采取的处理措施：${rmMeasure}。</div>

                    <div class="doc-text"><span class="doc-text-bold">3. 投诉处理情况：</span>本月质量投诉起数为 <span class="u-line">${cpTotal}</span> 起，有效投诉 <span class="u-line">${cpEff}</span> 起，无效投诉 <span class="u-line">${cpInv}</span> 起。</div>
                    <div class="doc-text">投诉产品主要为：${cpProd}；投诉主要原因为：${cpRes}；采取的主要改进措施为：${cpMeas}。</div>

                    <div class="doc-text"><span class="doc-text-bold">4. 供应商管理：</span>本月对供应商审核情况：${sup}</div>

                    <div class="doc-text"><span class="doc-text-bold">5. 从业人员培训情况：</span>本月开展培训 <span class="u-line">${tTimes}</span> 次，合计 <span class="u-line">${tHours}</span> 学时，参加人员 <span class="u-line">${tPpl}</span> 人。</div>

                    <div class="doc-text"><span class="doc-text-bold">6. 日管控问题落实：</span>（1）本月日常检查问题 <span class="u-line">${ckTot}</span> 项，已整改 <span class="u-line">${ckFix}</span> 项，待整改 <span class="u-line">${ckPen}</span> 项，计划整改时间为 <span class="u-line">${ckDate}</span>；（2）责任部门配合情况：${ckCoop}。</div>

                    <div class="doc-section-title keep-together">二、较大风险隐患排查情况</div>
                    <div class="doc-text">存在的主要风险隐患问题如下：</div>
                    <div style="margin-left: 1em;">${riskHTML}</div>

                    <div class="doc-section-title keep-together">三、食品安全相关部门发言及达成的共识</div>
                    <div style="margin-left: 1em;">${consensusHTML}</div>

                    <div class="doc-section-title keep-together">四、企业主要负责人工作要求（负责人：${leaderName}）</div>
                    <div style="margin-left: 1em;">${reqHTML}</div>

                    <div class="doc-section-title keep-together">五、下个月食品安全管理重点工作计划</div>
                    <div style="margin-left: 1em;">${planHTML}</div>

                    <div class="doc-footer">
                        <div style="flex:1;">汇报人/日期：${rep1} / ${mDate}</div>
                        <div style="flex:1; text-align:right;">企业负责人/日期：${leaderName} / ${mDate}</div>
                    </div>
                </div>
            `;

            document.getElementById('previewPaper').innerHTML = html;
            document.getElementById('previewOverlay').classList.remove('hidden');
            window.scrollTo(0, 0); 
        }

        function closePreview() { document.getElementById('previewOverlay').classList.add('hidden'); }

        // PDF 生成核心函数
        function generatePDF(event) {
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            const body = document.body;
            
            // UI 反馈
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> 生成中...';
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            // 关键：添加生成状态类，触发 CSS 去除阴影和边距
            body.classList.add('pdf-generating');

            const mMonth = document.getElementById('meetingMonth').value;
            const mYear = document.getElementById('meetingYear').value;
            const filename = `${mYear}年${mMonth}月食品安全调度会议纪要.pdf`;
            const element = document.getElementById('previewPaper');

            // 配置
            const opt = {
                /* 修复核心：
                   margin: [15, 0, 15, 0] 
                   - 为每一页（包括第一页和后续页）强制增加上下15mm的物理白边
                   - 这解决了第二页顶部内容紧贴页面边缘的问题
                   - 同时 CSS 中将 padding 上下设为了 0 或较小值，避免双重间距
                */
                margin:       [15, 0, 15, 0], 
                filename:     filename,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { 
                    scale: 2, 
                    useCORS: true, 
                    scrollY: 0, 
                    logging: false,
                    backgroundColor: '#ffffff', // 强制白底，防止变黑
                    // 再次确保克隆体无杂质
                    onclone: (clonedDoc) => {
                        const paper = clonedDoc.getElementById('previewPaper');
                        if(paper) {
                            paper.style.boxShadow = 'none';
                            paper.style.background = '#ffffff';
                            // 确保文本层级高于一切背景
                            const texts = paper.querySelectorAll('*');
                            texts.forEach(el => {
                                el.style.position = 'relative'; 
                                el.style.zIndex = '100';
                            });
                        }
                    }
                },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // 执行转换
            html2pdf().set(opt).from(element).save().then(() => {
                // 恢复
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                body.classList.remove('pdf-generating');
            }).catch(err => {
                console.error("PDF生成错误:", err);
                alert("PDF生成失败，请重试。");
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                body.classList.remove('pdf-generating');
            });
        }

        function generateFinalHTML(event) {
            // (保持原有HTML生成逻辑不变)
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> 生成中...';
            
            try {
                const previewContent = document.getElementById('previewPaper').innerHTML;
                const mMonth = document.getElementById('meetingMonth').value;
                const mYear = document.getElementById('meetingYear').value;
                
                const fullHTML = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>${mYear}年${mMonth}月食品安全调度会议纪要</title>
    <style>
        body { font-family: "SimSun", serif; color: #000; line-height: 1.6; font-size: 16px; margin: 0; padding: 0; background: #fff; }
        .container { width: 210mm; margin: 0 auto; padding: 25mm 31mm; box-sizing: border-box; }
        .doc-header-right { text-align: right; font-size: 14px; margin-bottom: 5px; font-family: 'SimHei'; }
        .doc-title { text-align: center; font-size: 28px; font-weight: bold; font-family: 'SimHei'; margin: 20px 0; }
        .doc-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .doc-table td { border: 1px solid #000; padding: 8px 10px; }
        .doc-label-cell { font-family: 'SimHei'; font-weight: bold; text-align: center; }
        .doc-section-title { font-family: 'SimHei'; font-weight: bold; font-size: 18px; margin: 24px 0 12px 0; border-bottom: 1px solid #000; padding-bottom: 4px; }
        .doc-text { text-align: justify; margin-bottom: 8px; text-indent: 2em; }
        .doc-text-bold { font-weight: bold; font-family: 'SimHei'; }
        .u-line { border-bottom: 1px solid #000; padding: 0 4px; display: inline-block; min-width: 30px; text-align: center; }
        .doc-footer { margin-top: 60px; display: flex; justify-content: space-between; }
    </style>
</head>
<body><div class="container">${previewContent}</div></body></html>`;
                
                const blob = new Blob([fullHTML], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `${mYear}年${mMonth}月食品安全调度会议纪要.html`;
                document.body.appendChild(link);
                link.click();
                setTimeout(() => { document.body.removeChild(link); URL.revokeObjectURL(url); btn.innerHTML = originalText; }, 100);
            } catch (error) {
                alert('出错'); btn.innerHTML = originalText;
            }
        }

        function resetForm() {
            if(confirm('确定要清空所有内容吗？')) {
                const inputs = document.querySelectorAll('input:not(#meetingYear):not(#meetingMonth), textarea');
                inputs.forEach(i => i.value = '');
                document.getElementById('meetingYear').value = '2026';
                document.getElementById('meetingMonth').value = '2';
                document.getElementById('startTime').value = '14:00';
                document.getElementById('endTime').value = '15:30';
                ['riskList', 'consensusList', 'reqList', 'planList'].forEach(id => {
                    document.getElementById(id).innerHTML = '';
                    addListItem(id);
                });
            }
        }
    </script>
</body>
</html>
