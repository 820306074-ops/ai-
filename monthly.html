<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每月食品安全调度会议纪要 - 强制校验版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 移除了 html2pdf.js，因为不再需要生成 PDF -->

    <style>
        html, body { 
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif; 
            background-color: #f3f4f6; 
            overscroll-behavior: none; 
            touch-action: pan-x pan-y; 
        }
        .section-title { @apply text-gray-700 font-bold mb-4 border-l-4 border-blue-600 pl-3 text-lg; }
        .input-label { @apply block text-sm font-bold text-gray-800 mb-2; }
        
        /* 修改：恢复白底黑字样式，以匹配提供的截图效果 */
        .input-field { @apply w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-500 focus:ring-blue-500 transition bg-white text-gray-700 shadow-sm outline-none; }
        
        /* 修改：恢复只读字段的淡灰色背景 */
        .input-readonly { @apply bg-gray-100 cursor-not-allowed text-gray-500; }
        
        /* 预览层样式 (A4 标准公文) */
        #previewOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #374151; z-index: 50; overflow-y: auto; padding-bottom: 80px;
        }
        #previewPaper {
            width: 210mm; 
            min-height: 297mm; 
            background: white; 
            margin: 30px auto; 
            padding: 25mm 31mm; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            font-family: "SimSun", "Songti SC", serif; 
            color: #000;
            line-height: 1.6;
            font-size: 16px; 
            box-sizing: border-box;
        }
        @media (max-width: 850px) {
            #previewPaper { width: 95%; padding: 15px; margin: 10px auto; zoom: 1; font-size: 14px; }
            #previewOverlay { padding-bottom: 120px; }
        }

        /* 预览排版类 */
        .doc-header-right { text-align: right; font-size: 14px; margin-bottom: 5px; font-family: 'SimHei', sans-serif; }
        .doc-title { 
            text-align: center; font-size: 28px; font-weight: bold; 
            font-family: 'SimHei', sans-serif; margin-bottom: 20px; 
            margin-top: 10px; letter-spacing: 2px;
        }
        .doc-record-no { margin-bottom: 10px; font-family: "SimSun"; font-size: 14px; }
        .doc-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 16px; table-layout: fixed; }
        .doc-table td { border: 1px solid #000; padding: 8px 10px; vertical-align: middle; word-wrap: break-word; }
        .doc-label-cell { font-family: 'SimHei', sans-serif; font-weight: bold; width: 100px; text-align: center; background-color: #fcfcfc; }
        .doc-section-title { 
            font-family: 'SimHei', sans-serif; font-weight: bold; font-size: 18px; 
            margin-top: 25px; margin-bottom: 10px; 
        }
        .doc-text { text-align: justify; margin-bottom: 6px; text-indent: 2em; }
        .doc-text-bold { font-weight: bold; font-family: 'SimHei'; }
        .u-line { border-bottom: 1px solid #000; padding: 0 4px; font-family: "SimSun"; display: inline-block; min-width: 30px; text-align: center; }
        .doc-footer { margin-top: 60px; display: flex; justify-content: space-between; page-break-inside: avoid; }
        .keep-together { page-break-inside: avoid; break-inside: avoid; }
        .doc-list-item { text-indent: 2em; margin-bottom: 4px; }

        /* Custom Modal Style */
        #customModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.5); z-index: 100;
        }
        .modal-content {
            background: white; padding: 24px; border-radius: 12px;
            max-width: 400px; width: 90%; text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }

        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="pb-32">

    <header class="fixed top-0 left-0 right-0 bg-white shadow-lg z-40 h-20">
        <div class="flex justify-between items-center px-6 py-3 bg-blue-700 text-white h-full">
            <div>
                <h1 class="text-xl font-bold flex items-center">
                    <i class="fa-solid fa-clipboard-check mr-3"></i>
                    每月食品安全调度会议纪要
                </h1>
                <p class="text-xs opacity-80 uppercase tracking-tighter">Food Safety Dispatch System</p>
            </div>
            <div class="hidden md:block text-sm font-medium">安全部：李川</div>
        </div>
    </header>

    <div class="h-24"></div>

    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 mt-6" id="mainFormContainer">
        
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h2 class="section-title">会议基本信息</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 记录编号：自动生成 -->
                <div>
                    <label class="input-label">记录编号</label>
                    <input type="text" id="recordNo" class="input-field input-readonly" placeholder="例如：20260203" readonly>
                </div>
                <!-- 会议年份：自动生成 -->
                <div>
                    <label class="input-label">会议年份 </label>
                    <input type="number" id="meetingYear" class="input-field input-readonly" value="2026" readonly>
                </div>
                <!-- 会议月份：自动生成 -->
                <div>
                    <label class="input-label">会议月份 </label>
                    <input type="number" id="meetingMonth" class="input-field input-readonly" value="2" readonly>
                </div>
                <div>
                    <label class="input-label">主持人</label>
                    <input type="text" id="host" class="input-field" placeholder="输入姓名" value="李川">
                </div>
                
                <!-- 会议日期：核心触发点 -->
                <div>
                    <label class="input-label text-blue-700">会议日期 (点击选择)</label>
                    <input type="date" id="meetingDate" class="input-field cursor-pointer border-blue-400 border-2" onchange="autoFillDateInfo()">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="input-label">开始时间</label>
                        <input type="time" id="startTime" class="input-field" value="14:00">
                    </div>
                    <div>
                        <label class="input-label">结束时间</label>
                        <input type="time" id="endTime" class="input-field" value="15:30">
                    </div>
                </div>
                <div class="md:col-span-1">
                    <label class="input-label">会议地点</label>
                    <input type="text" id="location" class="input-field" value="三楼会议室">
                </div>
                <div class="md:col-span-2">
                    <label class="input-label">出席人员</label>
                    <input type="text" id="attendees" class="input-field" placeholder="张三、李四、王五...">
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h2 class="section-title">一、食品安全管理工作情况汇报</h2>
            
            <div class="mb-6 max-w-md">
                <label class="input-label"><span class="text-red-600 mr-1">*</span>汇报人</label>
                <input type="text" id="reporter1" class="input-field border-blue-300" placeholder="此项必填">
            </div>

            <div class="bg-blue-50 p-5 rounded-lg mb-6 border border-blue-100">
                <h3 class="font-bold text-blue-800 mb-4 text-lg border-b border-blue-200 pb-2">1. 食品原料验收情况</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-6">
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">到货总批数</label>
                        <input type="number" id="rmTotal" class="input-field mt-1" value="30" oninput="calcRmRate()">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">合格批数</label>
                        <input type="number" id="rmQualified" class="input-field mt-1" value="29" oninput="calcRmRate()">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">不合格数 (自动)</label>
                        <input type="text" id="rmUnqualified" class="input-field input-readonly mt-1" readonly value="1">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">合格率 (自动)</label>
                        <input type="text" id="rmRate" class="input-field input-readonly mt-1" readonly value="96.7%">
                    </div>
                </div>
                <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
                    <label class="block text-base font-bold text-blue-900 mb-6"><i class="fa-solid fa-pen-to-square mr-1"></i> 不合格项详情描述</label>
                    
                    <!-- 不合格原料 -->
                    <div class="flex items-center mb-6">
                        <label class="text-sm font-bold text-gray-700 w-32 flex-shrink-0">不合格原料为：</label>
                        <textarea id="rmBadName" class="input-field flex-1" rows="1" placeholder="例如：1月6日购进的生菜"></textarea>
                    </div>
                    
                    <!-- 不合格原因 -->
                    <div class="flex items-center mb-6">
                        <label class="text-sm font-bold text-gray-700 w-32 flex-shrink-0">不合格原因为：</label>
                        <textarea id="rmBadReason" class="input-field flex-1" rows="1" placeholder="例如：农残快速检测超标"></textarea>
                    </div>
                    
                    <!-- 处理措施 -->
                    <div class="flex items-center">
                        <label class="text-sm font-bold text-gray-700 w-32 flex-shrink-0">采取的处理措施：</label>
                        <textarea id="rmBadMeasure" class="input-field flex-1" rows="2" placeholder="例如：当场拒收，退货处理"></textarea>
                    </div>
                </div>
            </div>

            <div class="bg-indigo-50 p-5 rounded-lg mb-6 border border-indigo-100">
                <h3 class="font-bold text-indigo-800 mb-4 text-lg border-b border-indigo-200 pb-2">2. 投诉处理情况</h3>
                
                <div class="grid grid-cols-3 gap-6 mb-6">
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">投诉总起数</label>
                        <input type="number" id="compTotal" class="input-field mt-1" value="0" oninput="calcCompInvalid()">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">有效投诉</label>
                        <input type="number" id="compEffective" class="input-field mt-1" value="0" oninput="calcCompInvalid()">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wide">无效投诉 (自动)</label>
                        <input type="number" id="compInvalid" class="input-field input-readonly mt-1" readonly value="0">
                    </div>
                </div>

                <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
                    <label class="block text-base font-bold text-indigo-900 mb-6"><i class="fa-solid fa-pen-to-square mr-1"></i> 投诉详情描述</label>
                    
                    <!-- 投诉产品 -->
                    <div class="flex items-center mb-6">
                        <label class="text-sm font-bold text-gray-700 w-32 flex-shrink-0">投诉产品主要为：</label>
                        <textarea id="compProduct" class="input-field flex-1" rows="1" placeholder="例如：红烧肉、米饭"></textarea>
                    </div>

                    <!-- 投诉原因 -->
                    <div class="flex items-center mb-6">
                        <label class="text-sm font-bold text-gray-700 w-32 flex-shrink-0">投诉主要原因为：</label>
                        <textarea id="compReason" class="input-field flex-1" rows="1" placeholder="例如：发现异物/口感不佳"></textarea>
                    </div>

                    <!-- 改进措施 -->
                    <div class="flex items-center">
                        <label class="text-sm font-bold text-gray-700 w-32 flex-shrink-0">采取的主要改进措施为：</label>
                        <textarea id="compMeasure" class="input-field flex-1" rows="2" placeholder="例如：对厨师进行批评教育，加强出餐检查"></textarea>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div class="bg-green-50 p-5 rounded-lg border border-green-100 flex flex-col">
                    <h3 class="font-bold text-green-800 mb-3 text-lg border-b border-green-200 pb-1">3. 供应商管理</h3>
                    <label class="input-label text-gray-600">本月对供应商审核情况：</label>
                    <textarea id="supplierStatus" class="input-field flex-grow" rows="4" placeholder="例如：本月对3家米面粮油供应商资质进行了年度复审，全部合格。"></textarea>
                </div>
                <div class="bg-orange-50 p-5 rounded-lg border border-orange-100">
                    <h3 class="font-bold text-orange-800 mb-3 text-lg border-b border-orange-200 pb-1">4. 培训情况</h3>
                    <div class="space-y-4">
                        <div><label class="input-label text-gray-600">本月开展培训次数：</label><input type="number" id="trainTimes" class="input-field" value="1"></div>
                        <div><label class="input-label text-gray-600">合计学时：</label><input type="number" id="trainHours" class="input-field" value="2"></div>
                        <div><label class="input-label text-gray-600">参加培训人员合计：</label><input type="number" id="trainPeople" class="input-field" value="15"></div>
                    </div>
                </div>
            </div>

            <div class="bg-gray-50 p-5 rounded-lg border border-gray-200">
                <h3 class="font-bold text-blue-800 mb-4 text-lg border-b border-gray-300 pb-1">5. 日管控检查问题落实</h3>
                <div class="grid grid-cols-3 gap-6 mb-4">
                    <div>
                        <label class="input-label text-gray-600">本月问题总数</label>
                        <input type="number" id="checkTotal" class="input-field" value="5" oninput="calcCheckPending()">
                    </div>
                    <div>
                        <label class="input-label text-gray-600">已落实整改数</label>
                        <input type="number" id="checkFixed" class="input-field" value="5" oninput="calcCheckPending()">
                    </div>
                    <div>
                        <label class="input-label text-gray-600">待整改数 (自动)</label>
                        <input type="number" id="checkPending" class="input-field input-readonly" readonly value="0">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="input-label text-gray-600">计划完成整改时间</label>
                        <input type="date" id="checkDeadline" class="input-field cursor-pointer">
                    </div>
                    <div>
                        <label class="input-label text-gray-600">相关责任部门配合情况</label>
                        <input type="text" id="checkCoop" class="input-field" value="各部门配合良好，整改及时。">
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 gap-6">
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-center mb-4 border-l-4 border-red-600 pl-3">
                    <h2 class="text-gray-700 font-bold text-lg">二、较大风险隐患排查情况</h2>
                    <button onclick="addListItem('riskList')" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded font-bold transition flex items-center shadow">
                        <i class="fa-solid fa-plus mr-1"></i> 添加隐患
                    </button>
                </div>
                <div id="riskList" class="space-y-4">
                    <div class="flex gap-4 items-center">
                        <span class="font-bold text-gray-400 w-6 text-right">1.</span>
                        <input type="text" class="input-field flex-grow" value="部分从业人员健康证即将到期">
                        <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash fa-lg"></i></button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-center mb-4 border-l-4 border-indigo-600 pl-3">
                    <h2 class="text-gray-700 font-bold text-lg">三、部门发言及共识</h2>
                    <button onclick="addListItem('consensusList')" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded font-bold transition flex items-center shadow">
                        <i class="fa-solid fa-plus mr-1"></i> 添加条目
                    </button>
                </div>
                <div id="consensusList" class="space-y-4">
                    <div class="flex gap-4 items-center">
                        <span class="font-bold text-gray-400 w-6 text-right">1.</span>
                        <input type="text" class="input-field flex-grow" value="各部门表示将全力配合食品安全整改工作。">
                        <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash fa-lg"></i></button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-center mb-4 border-l-4 border-yellow-600 pl-3">
                    <h2 class="text-gray-700 font-bold text-lg">四、企业主要负责人工作要求</h2>
                    <button onclick="addListItem('reqList')" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded font-bold transition flex items-center shadow">
                        <i class="fa-solid fa-plus mr-1"></i> 添加要求
                    </button>
                </div>
                <div class="mb-4 max-w-md">
                    <label class="input-label"><span class="text-red-600 mr-1">*</span>负责人姓名</label>
                    <input type="text" id="leaderName" class="input-field border-blue-300" placeholder="此项必填">
                </div>
                <div id="reqList" class="space-y-4">
                    <div class="flex gap-4 items-center">
                        <span class="font-bold text-gray-400 w-6 text-right">1.</span>
                        <input type="text" class="input-field flex-grow" value="必须严格落实日管控、周排查制度。">
                        <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash fa-lg"></i></button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md p-6 mb-12">
                <div class="flex justify-between items-center mb-4 border-l-4 border-green-600 pl-3">
                    <h2 class="text-gray-700 font-bold text-lg">五、下个月重点工作计划</h2>
                    <button onclick="addListItem('planList')" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded font-bold transition flex items-center shadow">
                        <i class="fa-solid fa-plus mr-1"></i> 添加计划
                    </button>
                </div>
                <div id="planList" class="space-y-4">
                    <div class="flex gap-4 items-center">
                        <span class="font-bold text-gray-400 w-6 text-right">1.</span>
                        <input type="text" class="input-field flex-grow" value="开展春季传染病预防专题培训。">
                        <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash fa-lg"></i></button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Actions -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 z-40 flex gap-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
        <button onclick="confirmReset()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-4 rounded-lg transition text-base">
            <i class="fa-solid fa-rotate-left mr-2"></i>重置
        </button>
        <button onclick="showReportPreview()" class="flex-[2] bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition text-base">
            <i class="fa-solid fa-file-signature mr-2"></i>预览报告
        </button>
    </div>

    <!-- Preview Overlay -->
    <div id="previewOverlay" class="hidden">
        <div id="previewPaper"></div>
        <div class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-700 p-4 z-50 flex gap-4 justify-center">
            <button onclick="closePreview()" class="bg-gray-600 hover:bg-gray-500 text-white px-6 py-2 rounded-lg font-bold">返回修改</button>
            <button onclick="exportHTML()" id="exportBtn" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-bold shadow-lg">导出HTML</button>
        </div>
    </div>

    <!-- Custom Notification Modal -->
    <div id="customModal">
        <div class="modal-content">
            <div id="modalIcon" class="text-4xl mb-4"></div>
            <p id="modalMsg" class="text-gray-800 font-bold mb-6"></p>
            <div class="flex gap-3 justify-center">
                <button id="modalSecondary" class="bg-gray-200 px-6 py-2 rounded font-bold text-gray-700 hidden">取消</button>
                <button id="modalPrimary" class="bg-blue-600 px-6 py-2 rounded font-bold text-white">确定</button>
            </div>
        </div>
    </div>

    <script>
        // Notification System
        function showNotify(msg, icon = '⚠️', onConfirm = null, isConfirm = false) {
            const modal = document.getElementById('customModal');
            const primary = document.getElementById('modalPrimary');
            const secondary = document.getElementById('modalSecondary');
            document.getElementById('modalMsg').innerText = msg;
            document.getElementById('modalIcon').innerText = icon;
            
            modal.style.display = 'flex';
            
            if(isConfirm) secondary.classList.remove('hidden');
            else secondary.classList.add('hidden');

            const handlePrimary = () => {
                modal.style.display = 'none';
                if(onConfirm) onConfirm();
                cleanup();
            };
            const handleSecondary = () => {
                modal.style.display = 'none';
                cleanup();
            };
            const cleanup = () => {
                primary.removeEventListener('click', handlePrimary);
                secondary.removeEventListener('click', handleSecondary);
            };

            primary.addEventListener('click', handlePrimary);
            secondary.addEventListener('click', handleSecondary);
        }

        // Date Format YYYY/M/D
        const formatSlashString = (dateString) => {
            if (!dateString) return "____/__/__";
            const parts = dateString.split('-'); 
            if(parts.length !== 3) return dateString;
            return `${parts[0]}/${parseInt(parts[1])}/${parseInt(parts[2])}`;
        };

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            const todayISO = new Date().toISOString().split('T')[0];
            document.getElementById('meetingDate').value = todayISO;
            document.getElementById('checkDeadline').value = todayISO;
            autoFillDateInfo(); // 自动填充初始日期的信息
            calcRmRate();
        });

        // 自动填充日期相关信息
        function autoFillDateInfo() {
            const dateVal = document.getElementById('meetingDate').value;
            if (dateVal) {
                const dateObj = new Date(dateVal);
                // 解决时区偏移问题：直接解析字符串
                const parts = dateVal.split('-');
                const y = parts[0];
                const m = parts[1];
                const d = parts[2];

                // 填充年份和月份
                document.getElementById('meetingYear').value = parseInt(y);
                document.getElementById('meetingMonth').value = parseInt(m);

                // 填充记录编号 (YYYYMMDD)
                document.getElementById('recordNo').value = `${y}${m}${d}`;
            }
        }

        function calcRmRate() {
            const total = parseInt(document.getElementById('rmTotal').value) || 0;
            const qual = parseInt(document.getElementById('rmQualified').value) || 0;
            const unqual = total - qual;
            document.getElementById('rmUnqualified').value = unqual >= 0 ? unqual : 0;
            
            if (total > 0 && qual >= 0 && qual <= total) {
                const rate = ((qual / total) * 100).toFixed(1) + '%';
                document.getElementById('rmRate').value = rate;
            } else {
                document.getElementById('rmRate').value = '0%';
            }
        }

        function calcCompInvalid() {
            const total = parseInt(document.getElementById('compTotal').value) || 0;
            const effective = parseInt(document.getElementById('compEffective').value) || 0;
            const invalid = total - effective;
            document.getElementById('compInvalid').value = invalid >= 0 ? invalid : 0;
        }

        function calcCheckPending() {
            const total = parseInt(document.getElementById('checkTotal').value) || 0;
            const fixed = parseInt(document.getElementById('checkFixed').value) || 0;
            const pending = total - fixed;
            document.getElementById('checkPending').value = pending >= 0 ? pending : 0;
        }

        function addListItem(containerId) {
            const container = document.getElementById(containerId);
            const count = container.children.length + 1;
            const div = document.createElement('div');
            div.className = 'flex gap-4 items-center animate-fade-in';
            div.innerHTML = `
                <span class="font-bold text-gray-400 w-6 text-right">${count}.</span>
                <input type="text" class="input-field flex-grow" placeholder="输入内容...">
                <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash fa-lg"></i></button>
            `;
            container.appendChild(div);
        }
