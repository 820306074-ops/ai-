<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>每月食品安全调度会议纪要</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
html, body {
  font-family: 'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;
  background:#f3f4f6;
}

/* ========== 填写区 ========== */
#formArea {
  padding-bottom: 120px;
}

/* ========== 预览 / PDF 区 ========== */
#printAreaOverlay {
  position: fixed;
  inset: 0;
  background:#374151;
  z-index: 50;
  overflow-y:auto;
  padding-bottom:90px;
  display:none;
}

#printArea {
  width:210mm;
  min-height:297mm;
  margin:30px auto;
  padding:25mm 30mm;
  background:#fff;
  font-family:"SimSun","Songti SC","Noto Serif SC",serif;
  font-size:16px;
  line-height:1.6;
  color:#000;
  box-shadow:0 10px 25px rgba(0,0,0,.45);
  box-sizing:border-box;
}

@media (max-width:768px){
  #printArea{
    width:95%;
    padding:16px;
    margin:12px auto;
    font-size:14px;
  }
}

/* ===== PDF 结构样式 ===== */
.doc-title{
  text-align:center;
  font-size:28px;
  font-family:"SimHei";
  font-weight:bold;
  margin-bottom:20px;
}
.doc-table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:16px;
}
.doc-table td{
  border:1px solid #000;
  padding:8px 10px;
}
.doc-label{
  width:100px;
  text-align:center;
  font-family:"SimHei";
}
.doc-section{
  font-family:"SimHei";
  font-size:18px;
  margin:22px 0 10px;
}
.doc-text{
  text-indent:2em;
  margin-bottom:6px;
}
.u-line{
  border-bottom:1px solid #000;
  display:inline-block;
  min-width:30px;
  text-align:center;
}
.footer{
  display:flex;
  justify-content:space-between;
  margin-top:50px;
}

/* ===== 导出时彻底隔离填写区 ===== */
@media print{
  body *{
    visibility:hidden;
  }
  #printArea, #printArea *{
    visibility:visible;
  }
  #printArea{
    position:absolute;
    left:0;
    top:0;
    margin:0;
    box-shadow:none;
  }
  @page{
    size:A4;
    margin:20mm;
  }
}
</style>
</head>

<body>

<!-- ================= 填写区（原逻辑保留） ================= -->
<div id="formArea">

  <!-- 你原来的 header + 表单内容 -->
  <!-- ⚠️ 这里我不重复贴了，保持你原样即可 -->
  <!-- 你只需要把原 <body> 里除了 previewOverlay 的内容 -->
  <!-- 全部包进这个 div 即可 -->

</div>

<!-- ================= 预览 + PDF 区 ================= -->
<div id="printAreaOverlay">
  <div id="printArea"></div>

  <div class="fixed bottom-0 left-0 right-0 bg-gray-900 p-4 flex justify-center gap-4">
    <button onclick="closePreview()" class="bg-gray-600 hover:bg-gray-500 text-white px-6 py-2 rounded font-bold">
      返回修改
    </button>
    <button onclick="generateFinalPDF()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded font-bold">
      生成 PDF
    </button>
  </div>
</div>

<script>
/* ===== 预览生成（完全复用你原逻辑） ===== */
function showReportPreview() {

  // ⚠️ 这里直接使用你原 showReportPreview 中
  // 所有取值、校验、拼 HTML 的代码
  // 我没有动任何字段 id、任何计算逻辑

  const html = `
    <div class="doc-title">每月食品安全调度会议纪要</div>

    <table class="doc-table">
      <tr><td class="doc-label">会议名称</td><td>示例</td></tr>
    </table>

    <div class="doc-section">一、食品安全管理工作情况</div>
    <div class="doc-text">……</div>
  `;

  document.getElementById("printArea").innerHTML = html;
  document.getElementById("printAreaOverlay").style.display = "block";
  window.scrollTo(0,0);
}

function closePreview(){
  document.getElementById("printAreaOverlay").style.display = "none";
}

/* ===== PDF 导出 ===== */
async function generateFinalPDF(){
  document.body.style.overflow='hidden';
  const opt={
    margin:0,
    filename:'食品安全调度会议纪要.pdf',
    image:{type:'jpeg',quality:0.98},
    html2canvas:{scale:1.5,scrollY:0,useCORS:true},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
  };
  await html2pdf().set(opt).from(document.getElementById("printArea")).save();
  document.body.style.overflow='';
}
</script>

</body>
</html>
